<script>
(()=>{
const root=document.getElementById('whendesk-taskdesk');const app=root.querySelector('.td-app');const body=root.querySelector('.td-body');const commandInput=root.querySelector('.td-command input');const commandBox=root.querySelector('.td-command-results');
const ic=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const icons=()=>globalThis.lucide?.createIcons({attrs:{width:17,height:17}});const today='2026-10-29';
const initial={version:4,scope:'tasks-calendar-command',view:'tasks',tab:'todo',selected:'t1',project:null,dueOnly:false,year:2026,month:9,date:today,skin:'base',mode:'system',tasks:[{id:'t1',title:'WHENDESK 기본 화면 정리',kind:'todo',project:'WHENDESK',due:today,note:'할 일 목록에서 제목과 마감을 바로 고칠 수 있게 정리한다.',done:false,waitingFor:''},{id:'t2',title:'기존 앱의 저장 방식 확인',kind:'todo',project:'WHENDESK',due:today,note:'원본 데이터는 보존하고, 가져올 때 복사하기.',done:false,waitingFor:''},{id:'t3',title:'테스트 결과 확인',kind:'todo',project:'WHENDESK',due:'2026-10-30',note:'',done:false,waitingFor:''},{id:'t4',title:'필요한 파일 정리',kind:'inbox',project:'개인',due:'',note:'',done:false,waitingFor:''},{id:'t5',title:'답변 확인하기',kind:'waiting',project:'WHENDESK',due:'2026-10-31',note:'',done:false,waitingFor:'담당자'},{id:'t6',title:'참고 자료 모으기',kind:'todo',project:'WHENDESK',due:'2026-10-28',note:'',done:true,waitingFor:''}],events:[{id:'e1',title:'치과 예약',date:today,time:'18:00',end:'18:30',location:''},{id:'e2',title:'택배 수령',date:'2026-10-30',time:'12:00',end:'12:30',location:''},{id:'e3',title:'개인 일정',date:'2026-10-31',time:'10:00',end:'11:00',location:''}]};
const s=structuredClone(initial);const saved=window.openai?.widgetState?.privateContent;if(saved?.version===4&&saved.scope===s.scope)Object.assign(s,saved);
let results=[],resultIndex=0,editingEvent=null,undoAction=null,feedbackTimer,returnFocus=null;
const uid=p=>p+'-'+(globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2));
function save(){window.openai?.setWidgetState?.({modelContent:{view:s.view,list:s.tab,selectedDate:s.date,skin:s.skin,mode:s.mode},privateContent:s}).catch(()=>{});}
function look(){app.dataset.skin=s.skin;app.style.colorScheme=s.mode==='system'?'light dark':s.mode;root.querySelector('[data-look=skin]').value=s.skin;root.querySelector('[data-look=mode]').value=s.mode;}
function feedback(message,action=null){const el=root.querySelector('.td-feedback');undoAction=action;el.innerHTML=`<span>${esc(message)}</span>${action?'<button data-action="undo">되돌리기</button>':''}<button data-action="dismiss" aria-label="알림 닫기">${ic('x')}</button>`;el.hidden=false;clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>{el.hidden=true;undoAction=null;},7000);icons();}
function nav(){const counts={todo:s.tasks.filter(t=>!t.done&&t.kind==='todo').length,inbox:s.tasks.filter(t=>!t.done&&t.kind==='inbox').length,waiting:s.tasks.filter(t=>!t.done&&t.kind==='waiting').length,done:s.tasks.filter(t=>t.done).length};root.querySelector('.td-sidebar').innerHTML=`<div class="td-workspace">나의 작업 공간</div><nav class="td-nav" aria-label="주 메뉴">${[['todo','할 일','circle-check'],['inbox','인박스','inbox'],['waiting','대기','hourglass'],['done','완료','archive']].map(([id,label,icon])=>`<button data-tab="${id}" class="${s.view==='tasks'&&s.tab===id?'active':''}" ${s.view==='tasks'&&s.tab===id?'aria-current="page"':''}>${ic(icon)}<span>${label}</span><small>${counts[id]}</small></button>`).join('')}<button class="td-nav-calendar ${s.view==='calendar'?'active':''}" data-action="calendar" ${s.view==='calendar'?'aria-current="page"':''}>${ic('calendar-days')}<span>캘린더</span></button><button data-action="command" aria-label="WHENCOMMAND 검색 및 실행">${ic('command')}<span class="td-command-long">WHENCOMMAND</span><span class="td-command-short">명령</span></button></nav><div class="td-projects"><small>프로젝트</small>${['WHENDESK','개인'].map(p=>`<button data-project="${p}" class="${s.project===p?'active':''}"><span class="td-dot"></span>${p}</button>`).join('')}</div><div class="td-sidebar-bottom">이 기기에 저장</div>`;icons();}
function visibleTasks(){return s.tasks.filter(t=>(s.tab==='done'?t.done:!t.done&&t.kind===s.tab)&&(!s.project||t.project===s.project)&&(!s.dueOnly||t.due)).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));}
function dueLabel(d){return !d?'마감 없음':d===today?'오늘':d==='2026-10-30'?'내일':d.slice(5).replace('-','.');}
function row(t){const open=s.selected===t.id;return `<article class="td-task ${open?'selected':''} ${t.done?'done':''}" data-task-row="${t.id}" ${open?'data-editor="'+t.id+'"':''}><div class="td-row"><input type="checkbox" data-check="${t.id}" aria-label="${esc(t.title)} 완료" ${t.done?'checked':''}>${open?`<div class="td-task-open"><input class="td-row-title" data-field="title" aria-label="할 일 제목" value="${esc(t.title)}"><small>${esc(t.project||'프로젝트 미지정')}${t.kind==='waiting'&&t.waitingFor?' · '+esc(t.waitingFor):''}</small></div>`:`<button class="td-task-open" data-task="${t.id}" draggable="true" aria-expanded="false"><span>${esc(t.title)}</span><small>${esc(t.project||'프로젝트 미지정')}${t.kind==='waiting'&&t.waitingFor?' · '+esc(t.waitingFor):''}</small></button>`}<button class="td-due ${t.due===today?'today':''}" data-edit-due="${t.id}" aria-label="${esc(t.title)} 마감 수정">${dueLabel(t.due)}</button>${open?`<button class="td-drag-handle" data-task="${t.id}" draggable="true" aria-label="할 일 끌기">${ic('grip-vertical')}</button>`:''}</div>${open?inline(t):''}</article>`;}
function inline(t){return `<div class="td-inline"><div class="td-fields"><label class="td-field">상태<select data-field="kind" aria-label="할 일 상태">${[['inbox','인박스'],['todo','할 일'],['waiting','대기']].map(([v,label])=>`<option value="${v}" ${t.kind===v?'selected':''}>${label}</option>`).join('')}</select></label><label class="td-field">마감<input type="date" data-field="due" aria-label="할 일 마감" value="${esc(t.due)}"></label><label class="td-field">프로젝트<select data-field="project" aria-label="할 일 프로젝트">${['','WHENDESK','개인'].map(p=>`<option value="${p}" ${t.project===p?'selected':''}>${p||'미지정'}</option>`).join('')}</select></label>${t.kind==='waiting'?`<label class="td-field">대기 상대<input data-field="waitingFor" aria-label="대기 상대" value="${esc(t.waitingFor)}"></label>`:''}</div><textarea class="td-note" data-field="note" aria-label="할 일 상세 내용" placeholder="필요한 내용을 남겨두세요." spellcheck="false">${esc(t.note)}</textarea><div class="td-inline-foot"><span>수정 내용 자동 저장</span><button data-action="collapse">${ic('chevron-up')}접기</button></div></div>`;}
function captureFocus(){const el=document.activeElement;if(!body.contains(el)||!el.matches('[data-field]'))return null;return {field:el.dataset.field,id:el.closest('[data-editor]')?.dataset.editor,start:el.selectionStart,end:el.selectionEnd,scroll:el.scrollTop};}
function restoreFocus(f){if(!f)return;const el=body.querySelector(`[data-editor="${f.id}"] [data-field="${f.field}"]`);if(el){el.focus({preventScroll:true});if(f.start!=null&&typeof el.setSelectionRange==='function'){try{el.setSelectionRange(f.start,f.end);}catch{}}el.scrollTop=f.scroll;}}
function main(){const focus=captureFocus();root.querySelector('.td-quick').hidden=s.view!=='tasks';root.querySelector('.td-main-head').innerHTML=s.view==='calendar'?`<div><h1>캘린더</h1><p>일정과 할 일의 마감</p></div><button class="td-primary" data-action="new-event">${ic('plus')}일정 추가</button>`:`<div><h1>${esc(s.project||({todo:'할 일',inbox:'인박스',waiting:'대기',done:'완료'})[s.tab])}</h1><p>${({todo:'해야 할 일을 하나씩 정리하세요.',inbox:'담아둔 일을 분류하세요.',waiting:'답변과 진행 상황을 기다리는 일.',done:'마친 일의 기록을 확인하세요.'})[s.tab]}</p></div>${s.project?'<button class="td-secondary" data-action="clear-project">전체 보기</button>':'<button class="td-icon-button" data-action="command" aria-label="검색 및 실행">'+ic('search')+'</button>'}`;
if(s.view==='calendar'){body.innerHTML=`<section class="td-full-calendar">${calendarMonth()}<div class="td-main-calendar-agenda"><h2>${Number(s.date.slice(5,7))}월 ${Number(s.date.slice(8))}일</h2>${eventRows(s.date)}</div></section>`;}else{const tasks=visibleTasks();body.innerHTML=`<div class="td-list-label"><span>${tasks.length}개 · 마감순</span><label><input type="checkbox" data-due-only ${s.dueOnly?'checked':''}>마감 있는 일</label></div><div class="td-rows">${tasks.map(row).join('')}</div>${!tasks.length?'<div class="td-empty">표시할 항목이 없어요.</div>':''}`;}restoreFocus(focus);icons();}
function calendarMonth(){const first=new Date(s.year,s.month,1);const offset=(first.getDay()+6)%7;const count=Math.ceil((offset+new Date(s.year,s.month+1,0).getDate())/7)*7;const start=new Date(s.year,s.month,1-offset);return `<div class="td-cal-head"><h2>${s.year}년 ${s.month+1}월</h2><div><button data-month="-1" aria-label="이전 달">${ic('chevron-left')}</button><button data-action="today">오늘</button><button data-month="1" aria-label="다음 달">${ic('chevron-right')}</button></div></div><div class="td-month">${['월','화','수','목','금','토','일'].map(d=>`<span class="td-weekday">${d}</span>`).join('')}${Array.from({length:count},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const events=s.events.filter(e=>e.date===key);const tasks=s.tasks.filter(t=>!t.done&&t.due===key);return `<button class="td-day ${key===today?'today':''} ${key===s.date?'selected':''} ${d.getMonth()!==s.month?'other':''}" data-date="${key}" aria-label="${key} 일정 ${events.length}개, 마감 ${tasks.length}개"><span>${d.getDate()}</span><span class="td-day-marks">${events.length?'<i class="td-event-mark"></i>':''}${tasks.length?'<i class="td-task-mark"></i>':''}</span></button>`;}).join('')}</div>`;}
function eventRows(date){const events=s.events.filter(e=>e.date===date).sort((a,b)=>a.time.localeCompare(b.time));return events.map(e=>`<button class="td-cal-event" data-event="${e.id}"><time>${esc(e.time)}</time><span>${esc(e.title)}<small>${esc(e.time)} – ${esc(e.end)}${e.location?' · '+esc(e.location):''}</small></span></button>`).join('')||'<div class="td-empty" style="padding:15px 0">등록된 일정이 없어요.</div>';}
function calendar(){root.querySelector('.td-calendar-side').innerHTML=calendarMonth()+`<div class="td-cal-legend"><i class="td-event-mark"></i>일정 <i class="td-task-mark"></i>할 일 마감</div><section class="td-day-detail"><div class="td-cal-head"><h2>${Number(s.date.slice(5,7))}월 ${Number(s.date.slice(8))}일 일정</h2><button data-action="new-event" aria-label="선택한 날짜에 일정 추가">${ic('plus')}</button></div>${eventRows(s.date)}<div class="td-deadlines"><small>이날 마감인 할 일</small>${s.tasks.filter(t=>!t.done&&t.due===s.date).map(t=>`<button class="td-deadline" data-reveal="${t.id}">${ic('circle')}<span>${esc(t.title)}</span></button>`).join('')||'<small>마감인 할 일이 없어요.</small>'}</div></section><p class="td-calendar-hint">할 일을 날짜로 끌어놓으면 마감이 바뀝니다.</p>`;icons();}
function reveal(id){const t=s.tasks.find(t=>t.id===id);if(!t)return;s.view='tasks';s.tab=t.done?'done':t.kind;s.selected=id;s.project=null;s.dueOnly=false;commandBox.hidden=true;nav();main();save();}
function addTask(title){const t={id:uid('task'),title,kind:'inbox',project:'',due:'',note:'',done:false,waitingFor:''};s.tasks.push(t);nav();if(s.view==='tasks'&&s.tab==='inbox'&&!s.project&&!s.dueOnly){body.querySelector('.td-empty')?.remove();body.querySelector('.td-rows')?.insertAdjacentHTML('beforeend',row(t));body.querySelector('.td-list-label>span').textContent=visibleTasks().length+'개 · 마감순';icons();}save();feedback('인박스에 담았어요.');return t;}
function changeDue(id,date){const t=s.tasks.find(t=>t.id===id);if(!t)return;const previous=t.due;t.due=date;const [y,m]=date.split('-').map(Number);s.year=y;s.month=m-1;s.date=date;main();calendar();save();feedback('마감을 '+Number(date.slice(5,7))+'월 '+Number(date.slice(8))+'일로 옮겼어요.',{type:'due',id,before:previous,after:date});}
function eventModal(id=null){editingEvent=id;const e=s.events.find(e=>e.id===id)||{title:'',date:s.date,time:'09:00',end:'10:00',location:''};returnFocus=document.activeElement;root.querySelector('.td-modal-layer').hidden=false;root.querySelector('.td-modal-layer').innerHTML=`<form class="td-modal" aria-label="일정 편집" role="dialog" aria-modal="true"><div class="td-modal-header"><h2>${id?'일정 수정':'일정 추가'}</h2><button type="button" data-action="close-event" aria-label="닫기">${ic('x')}</button></div><label class="td-field">제목<input name="title" aria-label="일정 제목" value="${esc(e.title)}" required></label><label class="td-field">날짜<input type="date" name="date" aria-label="일정 날짜" value="${e.date}" required></label><div class="td-fields"><label class="td-field">시작<input type="time" name="time" aria-label="일정 시작" value="${e.time}" required></label><label class="td-field">종료<input type="time" name="end" aria-label="일정 종료" value="${e.end}" required></label></div><label class="td-field">장소<input name="location" aria-label="일정 장소" value="${esc(e.location)}"></label><div class="td-modal-actions">${id?'<button type="button" class="td-modal-delete" data-action="delete-event">일정 삭제</button>':'<span></span>'}<div><button type="button" class="td-secondary" data-action="close-event">취소</button><button class="td-primary" type="submit">저장</button></div></div></form>`;root.querySelector('.td-modal [name=title]').focus();icons();}
function closeEvent(){root.querySelector('.td-modal-layer').hidden=true;if(returnFocus?.isConnected)returnFocus.focus({preventScroll:true});}
function choseong(text){const cs='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';return [...text].map(c=>{const n=c.charCodeAt(0)-44032;return n>=0&&n<11172?cs[Math.floor(n/588)]:c;}).join('');}
function search(q){commandBox.hidden=false;const query=q.trim().toLowerCase();const matches=(text)=>!query||text.toLowerCase().includes(query)||choseong(text).includes(query);results=[];const calc=query.match(/^(-?\d+(?:\.\d+)?)\s*([+*\/-])\s*(-?\d+(?:\.\d+)?)$/);if(calc){const a=+calc[1],b=+calc[3];const value=calc[2]==='+'?a+b:calc[2]==='-'?a-b:calc[2]==='*'?a*b:a/b;if(Number.isFinite(value))results.push({title:String(+value.toPrecision(12)),kind:'계산 결과',icon:'calculator',type:'calc'});}for(const t of s.tasks)if(matches(t.title+' '+t.note+' '+t.project))results.push({title:t.title,kind:'할 일',icon:'circle-check',type:'task',id:t.id});for(const e of s.events)if(matches(e.title+' '+e.date))results.push({title:e.title,kind:'일정',icon:'calendar-days',type:'event',id:e.id});for(const title of ['계산기','메모장','파일 탐색기'])if(matches(title))results.push({title,kind:'앱 실행 예시',icon:'app-window',type:'app'});if(query)results.push({title:'할 일 추가: '+q.replace(/^할\s?일 추가\s*/,''),kind:'인박스',icon:'plus',type:'create',text:q.replace(/^할\s?일 추가\s*/,'')});results=results.slice(0,7);resultIndex=0;commandBox.innerHTML=`<div class="td-command-label"><span>WHENCOMMAND</span><span>할 일 · 일정 · 앱 · 계산</span></div>${results.map((r,i)=>`<button class="td-command-result ${i===0?'selected':''}" data-result="${i}">${ic(r.icon)}<span>${esc(r.title)}</span><small>${r.kind}</small></button>`).join('')}<div class="td-command-help"><kbd>↑ ↓</kbd> 선택 &nbsp; <kbd>Enter</kbd> 실행 &nbsp; <kbd>Esc</kbd> 닫기</div>`;icons();}
function run(i){const r=results[i];if(!r)return;commandBox.hidden=true;if(r.type==='task')reveal(r.id);else if(r.type==='event')eventModal(r.id);else if(r.type==='create'){const t=addTask(r.text);reveal(t.id);}else feedback(r.type==='app'?'화면 미리보기입니다. 실제 앱에서 '+r.title+'를 실행합니다.':'계산 결과: '+r.title);}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!commandBox.contains(e.target)&&!e.target.closest('.td-command'))commandBox.hidden=true;if(!b){if(e.target===root.querySelector('.td-modal-layer'))closeEvent();return;}const d=b.dataset;if(d.tab){s.tab=d.tab;s.view='tasks';s.project=null;s.selected=null;nav();main();save();return;}if(b.classList.contains('td-drag-handle'))return;if(d.task){s.selected=s.selected===d.task?null:d.task;main();save();return;}if(d.reveal){reveal(d.reveal);return;}if(d.editDue){reveal(d.editDue);body.querySelector('[data-field=due]')?.focus();return;}if(d.date){s.date=d.date;const [y,m]=s.date.split('-').map(Number);s.year=y;s.month=m-1;calendar();if(s.view==='calendar')main();save();return;}if(d.month){const date=new Date(s.year,s.month+Number(d.month),1);s.year=date.getFullYear();s.month=date.getMonth();calendar();if(s.view==='calendar')main();save();return;}if(d.project){s.project=d.project;s.tab='todo';s.view='tasks';s.selected=null;nav();main();save();return;}if(d.event){eventModal(d.event);return;}if(d.result!==undefined){run(+d.result);return;}switch(d.action){case'collapse':s.selected=null;main();save();break;case'calendar':s.view='calendar';nav();main();save();break;case'clear-project':s.project=null;nav();main();save();break;case'command':commandInput.focus();search(commandInput.value);break;case'today':s.date=today;s.year=2026;s.month=9;calendar();if(s.view==='calendar')main();save();break;case'new-event':eventModal();break;case'close-event':closeEvent();break;case'delete-event':{const removed=s.events.find(x=>x.id===editingEvent);s.events=s.events.filter(x=>x.id!==editingEvent);closeEvent();calendar();if(s.view==='calendar')main();save();feedback('일정을 삭제했어요.',{type:'event',item:removed});break;}case'undo':{const action=undoAction;if(!action)return;if(action.type==='due'){const t=s.tasks.find(t=>t.id===action.id);if(t&&t.due===action.after)t.due=action.before;}else if(action.type==='event')s.events.push(action.item);nav();main();calendar();save();root.querySelector('.td-feedback').hidden=true;undoAction=null;break;}case'dismiss':root.querySelector('.td-feedback').hidden=true;break;}});
root.addEventListener('input',e=>{const el=e.target;if(el===commandInput){search(el.value);return;}if(el.matches('[data-field]')){const t=s.tasks.find(t=>t.id===el.closest('[data-editor]').dataset.editor);if(t){t[el.dataset.field]=el.value;if(el.dataset.field==='title'){const title=el.closest('.td-task').querySelector('.td-task-open>span');if(title)title.textContent=el.value;el.closest('.td-task').querySelector('[data-check]').setAttribute('aria-label',el.value+' 완료');}save();}}});
root.addEventListener('change',e=>{const el=e.target;if(el.dataset.look){s[el.dataset.look]=el.value;look();save();return;}if(el.dataset.check){const t=s.tasks.find(t=>t.id===el.dataset.check);t.done=el.checked;nav();main();calendar();save();return;}if(el.matches('[data-due-only]')){s.dueOnly=el.checked;main();save();return;}if(el.matches('[data-field]')){const t=s.tasks.find(t=>t.id===el.closest('[data-editor]').dataset.editor);if(!t)return;t[el.dataset.field]=el.value;if(el.dataset.field==='kind'){s.tab=t.kind;nav();main();}else if(el.dataset.field==='project'){el.closest('.td-task').querySelector('.td-task-open small').textContent=t.project||'프로젝트 미지정';}else if(el.dataset.field==='due'){el.closest('.td-task').querySelector('.td-due').textContent=dueLabel(t.due);calendar();}save();}});
root.addEventListener('submit',e=>{if(e.target.matches('.td-quick')){e.preventDefault();const input=e.target.querySelector('input');if(!input.value.trim())return;addTask(input.value.trim());input.value='';input.focus();}if(e.target.matches('.td-modal')){e.preventDefault();const values=Object.fromEntries(new FormData(e.target).entries());if(values.end<=values.time){e.target.querySelector('[name=end]').setCustomValidity('종료 시간을 시작 시간 이후로 정해주세요.');e.target.querySelector('[name=end]').reportValidity();e.target.querySelector('[name=end]').addEventListener('input',function(){this.setCustomValidity('');},{once:true});return;}const event=s.events.find(x=>x.id===editingEvent);if(event)Object.assign(event,values);else s.events.push({id:uid('event'),...values});s.date=values.date;[s.year,s.month]=values.date.split('-').slice(0,2).map(Number);s.month--;closeEvent();calendar();if(s.view==='calendar')main();save();feedback('일정을 저장했어요.');}});
commandInput.addEventListener('focus',()=>search(commandInput.value));
root.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();commandInput.focus();search(commandInput.value);}if(e.key==='Escape'){if(!root.querySelector('.td-modal-layer').hidden)closeEvent();else commandBox.hidden=true;}if(e.target===commandInput&&!commandBox.hidden){if(e.key==='Enter'){e.preventDefault();run(resultIndex);}if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();resultIndex=(resultIndex+(e.key==='ArrowDown'?1:results.length-1))%Math.max(1,results.length);commandBox.querySelectorAll('.td-command-result').forEach((b,i)=>b.classList.toggle('selected',i===resultIndex));}}});
root.addEventListener('dragstart',e=>{const item=e.target.closest('[data-task][draggable]');if(item){e.dataTransfer.setData('text/plain',item.dataset.task);e.dataTransfer.effectAllowed='move';}});root.addEventListener('dragover',e=>{const d=e.target.closest('[data-date]');if(d){e.preventDefault();d.classList.add('drag-over');e.dataTransfer.dropEffect='move';}});root.addEventListener('dragleave',e=>e.target.closest('[data-date]')?.classList.remove('drag-over'));root.addEventListener('drop',e=>{const d=e.target.closest('[data-date]');if(d){e.preventDefault();changeDue(e.dataTransfer.getData('text/plain'),d.dataset.date);}});
window.addEventListener('openai:set_globals',e=>{const next=e.detail?.globals?.widgetState?.privateContent;if(next?.version===4&&next.scope===s.scope){if(JSON.stringify(next)===JSON.stringify(s))return;Object.assign(s,next);nav();main();calendar();look();}});
nav();main();calendar();look();icons();if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:()=>{look();save();}});tweak.addSelect(s,'skin',{label:'스킨',options:[{label:'기본',value:'base'},{label:'잉크',value:'ink'},{label:'페이퍼',value:'paper'}]});tweak.addSelect(s,'mode',{label:'화면 모드',options:[{label:'시스템',value:'system'},{label:'라이트',value:'light'},{label:'다크',value:'dark'}]});}
})();
</script>
